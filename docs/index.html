    :root {

      --u: clamp(2.6px, 0.8vw, 5px);

    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Mulish", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      -webkit-text-size-adjust: 100%;

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }

    /* Letters of the i2c logo, scattered around the page. */
    .shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      left: calc(var(--x) - var(--ax) * var(--u));
      top: calc(var(--y) - var(--ay) * var(--u));
      width: calc(var(--w) * var(--u));
      height: calc(var(--h) * var(--u));
      fill: var(--ink);
      transform-origin: calc(var(--ax) * var(--u)) calc(var(--ay) * var(--u));
      animation:
        shape-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) var(--delay) both,
        shape-float var(--float-time) ease-in-out calc(var(--delay) + 1.2s) infinite;

    .shape--i-dot {
      --w: 12.5; --h: 12.5; --ax: 6.25; --ay: 6.25; --x: 9%; --y: 14%;

    .shape--i-stem {

    .shape--two {

    .shape--dot {

      --from-x: 0px; --from-y: 90px; --from-r: 0deg; --delay: 0.32s;
      --float-x: 8px; --float-y: -8px; --float-r: 0deg; --float-time: 8s;
    }

    @keyframes shape-in {
      from {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y)) rotate(var(--from-r)) scale(0.7);
      }
    }

    @keyframes shape-float {
      50% {
        translate: var(--float-x) var(--float-y);
        rotate: var(--float-r);
      }
    }

    @media (prefers-reduced-motion: reduce) {

    .site-header {

    .contact {

      flex-direction: column;
      align-items: center;
      justify-content: center;

    .contact__title {

      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.015em;
    }

    .contact__title::after {
      content: "";
      display: block;
      width: 4rem;
      height: 0.375rem;
      margin: 1.75rem auto 0;
      background: var(--ink);
    }

    .details {
      margin-top: 2.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-size: 1.1875rem;
      font-style: normal;

      letter-spacing: 0.03em;

    .details p { margin: 0; }

    .details__line { display: block; }

    .details a {
      color: inherit;
      text-decoration: none;
    }

    .details a:hover,
    .details a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    /* On narrow screens the name fits on one line; the NIP is what a cashier needs. */
    .details__name br { display: none; }
    .details__nip { font-size: 1.625rem; }

    /* Smallest phones: push the side shapes to the edges to keep them clear of the text. */
    @media (max-width: 359px) {
      .shape--i-stem { --x: 0%; }

      .details__nip { font-size: 1.5rem; }
    }

    /* Wide screens: the original four-column layout. */
    @media (min-width: 1500px) {
      :root {
        --u: clamp(6px, 0.4167vw, 10px);
