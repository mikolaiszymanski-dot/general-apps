  <style>
    /* Mulish self-hosted (SIL OFL 1.1, fonts/OFL.txt) in place of the Google Fonts import of design-system/i2c.css. */
    @font-face {
      font-family: "Mulish";
      font-style: normal;
      font-weight: 200 1000;
      font-display: swap;
      src: url("fonts/mulish-latin-ext-wght-normal.woff2") format("woff2-variations"),

      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: "Mulish";
      font-style: normal;
      font-weight: 200 1000;
      font-display: swap;
      src: url("fonts/mulish-latin-wght-normal.woff2") format("woff2-variations"),
           url("fonts/mulish-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body { margin: 0; }

    .page {
      /* --u: pixels per unit of the original mark, whose stroke is 4.07 units wide. */
      --u: clamp(6.4px, 1.96vw, 12.3px);
      --header-space: calc(var(--space-8) + var(--space-5));
      min-height: 100vh;
      min-height: 100svh;
    }

    /* Motif "rozbity znak": the original mark's pieces, scattered, flying in and floating. */
    .shape {
      position: absolute;
      left: calc(var(--x) - var(--ax) * var(--u));
      top: calc(var(--y) - var(--ay) * var(--u));
      width: calc(var(--w) * var(--u));
      height: calc(var(--h) * var(--u));
      transform-origin: calc(var(--ax) * var(--u)) calc(var(--ay) * var(--u));
      animation:
        shape-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) var(--delay) both,
        shape-float var(--float-time) ease-in-out calc(var(--delay) + 1.2s) infinite;
    }

    .shape--i-dot {
      --w: 5.0977; --h: 5.0977; --ax: 2.5488; --ay: 2.5488; --x: 9%; --y: 14%;
      --from-x: -80px; --from-y: -60px; --from-r: 0deg; --delay: 0s;
      --float-x: 6px; --float-y: -10px; --float-r: 0deg; --float-time: 7s;
    }

    .shape--i-stem {
      --w: 4.0742; --h: 12.8789; --ax: 0; --ay: 0; --x: 4%; --y: 56%;
      --from-x: -40px; --from-y: 120px; --from-r: -8deg; --delay: 0.08s;
      --float-x: 0px; --float-y: -14px; --float-r: 0deg; --float-time: 9s;
    }

    .shape--c {
      --w: 8.1953; --h: 16.3906; --ax: 8.1953; --ay: 8.1953; --x: 94%; --y: 9%;
      --from-x: 60px; --from-y: -80px; --from-r: -45deg; --delay: 0.16s;
      --float-x: -6px; --float-y: 6px; --float-r: 6deg; --float-time: 11s;
    }

    .shape--two {
      --w: 17.1445; --h: 23.3281; --ax: 8.949; --ay: 8.1996; --x: 90%; --y: 90%;
      --from-x: 80px; --from-y: 100px; --from-r: 30deg; --delay: 0.24s;
      --float-x: -8px; --float-y: -6px; --float-r: -4deg; --float-time: 10s;
    }

    .shape--dot {
      --w: 5.0938; --h: 5.0977; --ax: 2.5469; --ay: 2.5488; --x: 22%; --y: 93%;
      --from-x: 0px; --from-y: 90px; --from-r: 0deg; --delay: 0.32s;
      --float-x: 8px; --float-y: -8px; --float-r: 0deg; --float-time: 8s;
    }

    @keyframes shape-in {
      from {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y)) rotate(var(--from-r)) scale(0.7);
      }
    }

    @keyframes shape-float {
      50% {
        translate: var(--float-x) var(--float-y);
        rotate: var(--float-r);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shape { animation: none; }
    }

    .site-header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 1;
      display: flex;
      justify-content: center;
      padding-top: var(--space-6);
    }

    .brand { display: block; line-height: 0; }
    .brand__logo { display: block; width: auto; height: 36px; }

    .brand:focus-visible,
    .contact a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .contact {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      padding: var(--header-space) var(--space-5);
      text-align: center;
    }

    .contact__title {
      font-size: clamp(40px, 11vw, 64px);
      line-height: 1;
    }

    /* .i2c-contact is the four-column row from the design system; narrow screens stack it. */
    .contact__details {
      grid-auto-flow: row;
      justify-items: center;
      gap: var(--space-4);
      font-style: normal;
    }

    .contact__details p { margin: 0; }
    .contact__name br { display: none; }
    .contact__line { display: block; }

    /* The number a cashier types when the phone is shown at a till. */
    .contact__nip { font-size: 26px; }

    .contact a {
      color: inherit;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    @media (max-width: 359px) {
      .shape--i-stem { --x: 0%; }
      .shape--c { --x: 99%; }
      .contact__nip { font-size: 24px; }
    }

    /* Wide screens: the original 1920 x 700 composition and the four-column row. */
    @media (min-width: 1600px) {
      .page {
        --u: 1.01626vw;
        --header-space: calc(var(--space-9) + var(--space-4));
      }

      .shape--i-dot { --x: 10.142%; --y: 19.39%; }
      .shape--i-stem { --x: 18.229%; --y: 44.857%; }
      .shape--c { --x: 76.037%; --y: 7.584%; }
      .shape--two { --x: 89.563%; --y: 71.713%; }
      .shape--dot { --x: 58.422%; --y: 88.247%; }

      .site-header { padding-top: var(--space-7); }
      .brand__logo { height: 50px; }
      .contact { gap: var(--space-8); }

      .contact__details {
        grid-auto-flow: column;
        justify-items: stretch;
        gap: var(--space-8);
      }

      .contact__name { text-align: right; }
      .contact__name br { display: inline; }
      .contact__ids { text-align: left; }
      .contact__nip { font-size: inherit; }
    }
  </style>
